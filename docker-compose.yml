services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: certificate_db
    environment:
      POSTGRES_DB: certificate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application
  api:
    build: .
    container_name: certificate_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/certificate_db
      CERTIFICATE_OUTPUT_DIR: generated_certificates
      APP_ENV: production
      DEBUG: "false"
    volumes:
      - certificates_data:/app/generated_certificates
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
    driver: local
  certificates_data:
    driver: local
